<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — Apuntes UNI</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="index.html" class="brand-logo" aria-label="Inicio Apuntes UNI">
      <span class="brand-icon">U</span>
      <span class="brand-text">Apuntes <span class="brand-accent">UNI</span></span>
    </a>
  </header>

  <!-- Indicador de pasos (Paso 1 de 3) -->
  <div class="steps-indicator">
    <div class="step-circle active" aria-current="step">1</div>
    <div class="step-line"></div>
    <div class="step-circle">2</div>
    <div class="step-line"></div>
    <div class="step-circle">3</div>
  </div>

  <main class="auth-card">
    <h1 class="auth-card-title">Recuperar contraseña</h1>
    <p class="auth-card-subtitle">Ingresa tu correo y te enviaremos un enlace de acceso.</p>

    <form onsubmit="event.preventDefault(); alert('Se ha enviado un enlace de recuperación a tu correo institucional.'); window.location.href='login.html';">
      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="correo@uni.edu.pe" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Enviar enlace</button>
    </form>

    <div class="auth-card-footer">
      <a href="login.html" style="color: var(--color-text-muted); font-size: 0.85rem;">Volver al inicio de sesión</a>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
