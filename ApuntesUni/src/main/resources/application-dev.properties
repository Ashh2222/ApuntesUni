# ==========================================
# Perfil de Desarrollo (DEV) - Apuntes UNI
# ==========================================
spring.application.name=ApuntesUni

# Base de datos H2 en memoria para desarrollo local
spring.datasource.url=jdbc:h2:mem:apuntes_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Almacenamiento local de archivos
app.storage.location=./uploads/apuntes

# Carga de archivos multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Inicialización de datos de prueba
app.init-data=true
