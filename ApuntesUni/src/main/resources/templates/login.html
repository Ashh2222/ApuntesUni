<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Apuntes UNI</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a th:href="@{/}" class="brand-logo" aria-label="Inicio Apuntes UNI">
      <span class="brand-icon">U</span>
      <span class="brand-text">Apuntes <span class="brand-accent">UNI</span></span>
    </a>
  </header>

  <main class="auth-card">
    <h1 class="auth-card-title">Bienvenido de vuelta</h1>
    <p class="auth-card-subtitle">Ingresa con tu cuenta universitaria.</p>

    <!-- Alertas Flash -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="correo@uni.edu.pe" required autofocus>
      </div>

      <div class="form-group">
        <div class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password">Contraseña</label>
          <a th:href="@{/recuperar-password}" style="font-size: 0.8rem; font-weight: 500;">¿Olvidaste tu contraseña?</a>
        </div>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Ingresar</button>
    </form>

    <div class="auth-card-footer">
      ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate gratis</a>
    </div>
  </main>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
