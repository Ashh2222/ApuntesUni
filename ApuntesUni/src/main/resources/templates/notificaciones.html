<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones — Apuntes UNI</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header Autenticado -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="main-content main-content-narrow">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Encabezado con Contador y Acción -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.55rem; font-weight: 700; color: var(--color-text); margin-bottom: 2px;">Notificaciones</h1>
        <p style="font-size: 0.85rem; color: var(--color-text-muted);" th:text="${unreadCount} + ' sin leer'">0 sin leer</p>
      </div>

      <form th:if="${unreadCount > 0}" th:action="@{/notificaciones/leer-todas}" method="post" style="margin: 0;">
        <button type="submit" class="btn" style="background: none; border: none; color: var(--color-primary); font-size: 0.88rem; font-weight: 500; cursor: pointer;">
          Marcar todas como leídas
        </button>
      </form>
    </div>

    <!-- Lista de Notificaciones -->
    <div class="notifications-list" id="notifList">

      <div th:if="${#lists.isEmpty(notifications.content)}" style="text-align: center; padding: 50px 20px; background: white; border-radius: 12px; border: 1px dashed #cbd5e1;">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">🔔</div>
        <h3 style="color: #334155; margin-bottom: 6px;">Bandeja al día</h3>
        <p style="color: #64748b; font-size: 0.88rem;">No tienes nuevas notificaciones en este momento.</p>
      </div>

      <article th:each="n : ${notifications.content}" class="notification-card" th:classappend="${!n.read} ? 'unread' : ''">
        <div class="notification-icon-box" style="background-color: #f1f5f9; color: var(--color-primary);">
          🔔
        </div>
        <div class="notification-content" style="flex: 1;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <h2 class="notification-title" th:text="${n.title != null and !n.title.isBlank() ? n.title : 'Aviso del Sistema'}">Título de notificación</h2>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span th:if="${!n.read}" class="notification-badge-dot"></span>
              <form th:if="${!n.read}" th:action="@{/notificaciones/{id}/leer(id=${n.id})}" method="post" style="margin: 0;">
                <button type="submit" style="background: none; border: none; font-size: 0.75rem; color: #64748b; cursor: pointer; text-decoration: underline;">
                  Marcar leída
                </button>
              </form>
            </div>
          </div>
          <p class="notification-body" th:text="${n.message}">
            Cuerpo del mensaje de notificación.
          </p>
          <div class="notification-footer">
            <span th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Hace un momento</span>
            <a th:if="${n.relatedNote != null}" th:href="@{/apuntes/{id}(id=${n.relatedNote.id})}" style="font-weight: 600;">Ver apunte relacionado →</a>
          </div>
        </div>
      </article>

    </div>

    <!-- Paginación si hay más de una página -->
    <div th:if="${notifications.totalPages > 1}" style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
      <a th:if="${notifications.hasPrevious()}" th:href="@{/notificaciones(page=${notifications.number - 1})}" class="btn btn-secondary btn-sm">&larr; Anterior</a>
      <span style="display: flex; align-items: center; padding: 0 10px; font-size: 0.85rem; color: #64748b;" th:text="'Página ' + (${notifications.number} + 1) + ' de ' + ${notifications.totalPages}"></span>
      <a th:if="${notifications.hasNext()}" th:href="@{/notificaciones(page=${notifications.number + 1})}" class="btn btn-secondary btn-sm">Siguiente &rarr;</a>
    </div>

  </main>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
