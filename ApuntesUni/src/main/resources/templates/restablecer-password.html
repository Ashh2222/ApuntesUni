<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — Apuntes UNI</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a th:href="@{/}" class="brand-logo" aria-label="Inicio Apuntes UNI">
      <span class="brand-icon">U</span>
      <span class="brand-text">Apuntes <span class="brand-accent">UNI</span></span>
    </a>
  </header>

  <main class="auth-card">
    <h1 class="auth-card-title">Nueva contraseña</h1>
    <p class="auth-card-subtitle">Ingresa y confirma tu nueva contraseña de acceso.</p>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <form th:action="@{/restablecer-password}" method="post">
      <input type="hidden" name="token" th:value="${token}">

      <div class="form-group">
        <label for="password" class="form-label">Nueva contraseña</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6" autofocus>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repite tu contraseña" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Guardar nueva contraseña</button>
    </form>

    <div class="auth-card-footer">
      <a th:href="@{/login}" style="color: var(--color-text-muted); font-size: 0.85rem;">Volver al inicio de sesión</a>
    </div>
  </main>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
